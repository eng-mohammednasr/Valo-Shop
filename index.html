    if(rels){var tot=0;rels.forEach(function(r){(r.assets||[]).forEach(function(x){if(x.name==='valoshop.apk')tot+=x.download_count||0})});st.d=tot;$('d-dls').textContent=fmt(tot);
      var L=$('old-list');L.innerHTML='';var olds=rels.slice(1).filter(function(r){return (r.assets||[]).some(function(x){return x.name==='valoshop.apk'})});
      if(!olds.length){L.innerHTML='<p class="mut" style="margin:0 0 14px">'+T('oldnone')+'</p>'}
      olds.forEach(function(r){var x=r.assets.filter(function(y){return y.name==='valoshop.apk'})[0],row=document.createElement('div'),s=document.createElement('span'),l=document.createElement('a');row.className='old-row';s.textContent=(r.tag_name||'')+' · '+mb(x.size);l.href=x.browser_download_url;l.textContent=T('get');row.appendChild(s);row.appendChild(l);L.appendChild(row)})}
    var hr=$('hero-rate');
    if(rating&&rating.total){hr.classList.add('show');$('hr-avg').textContent=rating.avg.toFixed(1);$('hr-cnt').textContent='· '+T('rc').replace('{n}',fmt(rating.total))}
    if(st.v!=null)$('d-vis').textContent=fmt(st.v);
    hs();
  }

  function apply(l,save){
    lang=l;if(save){try{localStorage.setItem(LK,l)}catch(e){}}
    root.setAttribute('dir',l==='ar'?'rtl':'ltr');root.setAttribute('lang',l);document.documentElement.setAttribute('lang',l);
    document.title=T('title');
    root.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=T(e.getAttribute('data-i'))});
    root.querySelectorAll('[data-ar]').forEach(function(e){var v=e.getAttribute('data-'+l);if(v!=null)e.innerHTML=v});
    $('lang-ar').classList.toggle('active',l==='ar');$('lang-en').classList.toggle('active',l==='en');
    render();
  }
  var l0='en',pr=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||''];
  for(var i=0;i<pr.length;i++){var c=String(pr[i]).toLowerCase();if(c.indexOf('ar')===0){l0='ar';break}if(c.indexOf('en')===0){l0='en';break}}
  try{var sv=localStorage.getItem(LK);if(sv==='ar'||sv==='en')l0=sv}catch(e){}
  $('lang-ar').addEventListener('click',function(){apply('ar',true)});
  $('lang-en').addEventListener('click',function(){apply('en',true)});
  $('yr').textContent=new Date().getFullYear();
  apply(l0,false);

  // Releases (size, version, fingerprint, counters, older versions)
  fetch('https://api.github.com/repos/'+OWNER+'/releases?per_page=100').then(function(r){return r.json()}).then(function(rs){rels=Array.isArray(rs)?rs:[];render()}).catch(function(){});
  fetch('https://countapi.mileshilliard.com/api/v1/hit/valo-shop-mn-2026-app-visits').then(function(r){return r.json()}).then(function(d){st.v=Number(d.value);render()}).catch(function(){$('d-vis').textContent='—'});

  // Rating summary for the hero (exact counts straight from Firestore)
  (function(){
    var base='https://firestore.googleapis.com/v1/projects/valo-shop-30ee1/databases/(default)/documents:runAggregationQuery?key=AIzaSyC5EssoHu3xyhwTnewgx4OdSbjBr_EnvMo';
    Promise.all([1,2,3,4,5].map(function(n){
      return fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredAggregationQuery:{aggregations:[{alias:'c',count:{}}],structuredQuery:{from:[{collectionId:'users'}],where:{fieldFilter:{field:{fieldPath:'rating'},op:'EQUAL',value:{integerValue:String(n)}}}}}})})
        .then(function(r){return r.json()}).then(function(j){return Number(j[0].result.aggregateFields.c.integerValue)||0});
    })).then(function(c){var t=c.reduce(function(a,b){return a+b},0),s=c.reduce(function(a,b,i){return a+b*(i+1)},0);rating={total:t,avg:t?s/t:0};render()}).catch(function(){});
  })();

  // After a download tap: ask for a rating + comment (skipped if this device already commented or chose "later" this session)
  var modal=$('dl-modal');
  function closeM(){modal.classList.remove('show');try{sessionStorage.setItem('valo-m','1')}catch(e){}}
  root.querySelectorAll('[data-dl]').forEach(function(a){a.addEventListener('click',function(){
    try{if(localStorage.getItem('valo-comment-last')||sessionStorage.getItem('valo-m'))return}catch(e){}
    setTimeout(function(){modal.classList.add('show');$('m-go').focus()},1500);
  })});
  $('m-later').addEventListener('click',closeM);
  modal.addEventListener('click',function(e){if(e.target===modal)closeM()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
  $('m-go').addEventListener('click',function(){closeM();var s=$('comments');if(s)s.scrollIntoView({behavior:'smooth'})});
})();
</script>
<script src="comments.js?v=4"></script>
</body>
